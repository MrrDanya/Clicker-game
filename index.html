<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кликер PRO | Общая таблица лидеров</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, #0a1f1a, #030c12);
            font-family: -apple-system, 'Segoe UI', 'Roboto', sans-serif;
            padding: 16px;
        }

        .app {
            max-width: 550px;
            width: 100%;
            margin: 0 auto;
            background: rgba(8, 22, 28, 0.9);
            backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 20px 18px 24px;
            border: 1px solid rgba(255, 200, 100, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;
            color: #ffd966;
            font-size: 1.8rem;
            margin: 0 0 5px;
            letter-spacing: 1px;
        }

        .sub {
            text-align: center;
            color: #9aaec0;
            font-size: 0.7rem;
            margin-bottom: 20px;
        }

        /* Баланс */
        .balance {
            background: #00000066;
            border-radius: 70px;
            padding: 12px 20px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #ffcd7e;
        }

        .balance span {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFE6A3, #FFB347);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        /* Никнейм */
        .nick-section {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .nick-section input {
            flex: 1;
            background: #1a2f38;
            border: 2px solid #ffb347;
            padding: 14px 16px;
            border-radius: 60px;
            color: white;
            font-size: 1rem;
            text-align: center;
            font-family: inherit;
        }

        .nick-section button {
            background: #ffb347;
            border: none;
            padding: 14px 24px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.05s;
        }

        .nick-section button:active {
            transform: scale(0.96);
        }

        /* Кнопка клика */
        .clicker-area {
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }

        .click-btn {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle at 35% 30%, #ffaa44, #d84300);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            box-shadow: 0 20px 30px rgba(0,0,0,0.5), inset 0 -8px 0 rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.03s;
            border: 3px solid #ffdd99;
        }

        .click-btn:active {
            transform: scale(0.96);
        }

        .power-info {
            text-align: center;
            background: #000000aa;
            padding: 6px 14px;
            border-radius: 40px;
            display: inline-block;
            width: auto;
            margin: 12px auto 0;
            font-size: 0.85rem;
            font-weight: bold;
            color: #ffefbf;
        }

        /* Улучшения */
        .upgrades-section {
            margin: 20px 0;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .upgrade-card {
            background: #0e2a32dd;
            border-radius: 28px;
            padding: 12px 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid #ffb65e;
        }

        .upgrade-name {
            font-weight: bold;
            color: #ffda99;
            font-size: 0.9rem;
            flex: 2;
            min-width: 120px;
        }

        .upgrade-price {
            background: #00000099;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #ffeaac;
        }

        .buy-btn {
            background: #2a4b55;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            color: #ffeaac;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.05s;
        }

        .buy-btn:active {
            transform: scale(0.96);
            background: #ffae42;
            color: #1e2a1c;
        }

        .buy-btn:disabled {
            opacity: 0.5;
            transform: none;
        }

        /* Таблица лидеров */
        .leaderboard {
            background: #0a1820cc;
            border-radius: 32px;
            padding: 16px;
            margin-top: 16px;
        }

        .leaderboard h3 {
            color: #ffd966;
            text-align: center;
            margin: 0 0 12px;
            font-size: 1.1rem;
        }

        .leader-list {
            max-height: 250px;
            overflow-y: auto;
        }

        .leader-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1px solid #ffb34755;
            color: #e0e0e0;
            font-size: 0.9rem;
        }

        .leader-rank {
            color: #ffb347;
            font-weight: bold;
            width: 40px;
        }

        .leader-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .leader-score {
            font-weight: bold;
            color: #ffd966;
        }

        /* Кнопки */
        .sync-btn {
            background: #2c464f;
            border: none;
            padding: 12px;
            border-radius: 60px;
            color: #ffcf9a;
            font-weight: bold;
            width: 100%;
            margin-top: 16px;
            cursor: pointer;
            transition: transform 0.05s;
        }

        .sync-btn:active {
            transform: scale(0.97);
        }

        .copy-btn {
            background: #2c464f;
            border: none;
            padding: 10px;
            border-radius: 60px;
            color: #ffcf9a;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        footer {
            font-size: 0.6rem;
            text-align: center;
            margin-top: 16px;
            color: #7b9aac;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #aaa;
        }

        .floating {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #2a6b4e;
            color: white;
            padding: 12px 20px;
            border-radius: 60px;
            text-align: center;
            font-weight: bold;
            z-index: 1000;
            animation: fadeOut 2s forwards;
            font-size: 0.9rem;
        }

        @keyframes fadeOut {
            0% { opacity: 1; transform: translateY(0); }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; transform: translateY(20px); }
        }

        @keyframes numberPop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-pop {
            animation: numberPop 0.3s ease-out;
        }
    </style>
</head>
<body>
<div class="app">
    <h1>💎 КЛИКER PRO</h1>
    <div class="sub">🏆 ОБЩАЯ ТАБЛИЦА ЛИДЕРОВ 🏆</div>

    <div class="balance">
        <span id="coinsDisplay">0</span> 💎
    </div>

    <div class="nick-section">
        <input type="text" id="nickname" placeholder="Твой ник" maxlength="20" autocomplete="off">
        <button id="setNickBtn">✅ ВОЙТИ</button>
    </div>

    <div class="clicker-area">
        <div class="click-btn" id="clickBtn">💎</div>
    </div>
    <div style="text-align: center;">
        <div class="power-info" id="powerInfo">⚡ Сила клика: 1</div>
    </div>

    <div class="upgrades-section" id="upgradesContainer"></div>

    <div class="leaderboard">
        <h3>🏆 ТОП ИГРОКОВ (ВСЕ УСТРОЙСТВА) 🏆</h3>
        <div id="leadersList" class="loading">Загрузка...</div>
        <button class="sync-btn" id="syncBtn">💾 СОХРАНИТЬ МОЙ ПРОГРЕСС</button>
    </div>

    <button class="copy-btn" id="copyLinkBtn">🔗 СКОПИРОВАТЬ ССЫЛКУ ДЛЯ ДРУЗЕЙ</button>
    <footer>⭐ Все игроки видят общий рейтинг! Нажми «Сохранить», чтобы попасть в таблицу.</footer>
</div>

<script>
    // ========== НАСТРОЙКИ — ЗАМЕНИ НА СВОИ! ==========
    const REPO_OWNER = "MrrDanya";           // Твой GitHub ник
    const REPO_NAME = "clicker-leaders";      // Название репозитория с leaders.json
    const GITHUB_TOKEN = "ghp_UDTEDfENLcDBsqaYeY3hGJb0XTdId1jEPTF"; // Твой токен
    // =================================================

    let currentNick = localStorage.getItem("nick") || "";
    let myCoins = parseInt(localStorage.getItem("coins") || "0");
    let clickPower = 1;

    // Улучшения
    let upgrades = [
        { id: 0, name: "✊ Усиленный палец", price: 15, bonus: 1, level: 0, maxLvl: 50 },
        { id: 1, name: "⚡ Быстрый тап", price: 80, bonus: 2, level: 0, maxLvl: 30 },
        { id: 2, name: "🌀 Гипертап", price: 350, bonus: 5, level: 0, maxLvl: 15 },
        { id: 3, name: "🏆 Длань Бога", price: 1400, bonus: 12, level: 0, maxLvl: Infinity },
        { id: 4, name: "💠 Кибер-импульс", price: 5000, bonus: 28, level: 0, maxLvl: Infinity }
    ];

    function calcPower() {
        let bonus = 0;
        upgrades.forEach(u => bonus += u.level * u.bonus);
        clickPower = 1 + bonus;
        return clickPower;
    }

    function getUpgradePrice(up) {
        if (up.level >= up.maxLvl) return Infinity;
        let extra = up.level * up.price * 0.5;
        return Math.floor(up.price + extra);
    }

    function renderUpgrades() {
        let container = document.getElementById("upgradesContainer");
        if (!container) return;
        container.innerHTML = "";
        upgrades.forEach(up => {
            let price = getUpgradePrice(up);
            let maxed = up.level >= up.maxLvl;
            let card = document.createElement("div");
            card.className = "upgrade-card";
            card.innerHTML = `
                <div class="upgrade-name">${up.name} (ур.${up.level}) +${up.bonus}</div>
                <div class="upgrade-price">💰 ${maxed ? "MAX" : price}</div>
                <button class="buy-btn" data-id="${up.id}" ${maxed ? "disabled style='opacity:0.5'" : ""}>Купить</button>
            `;
            container.appendChild(card);
        });

        document.querySelectorAll(".buy-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                let id = parseInt(btn.dataset.id);
                let up = upgrades[id];
                let price = getUpgradePrice(up);
                if (myCoins >= price && up.level < up.maxLvl) {
                    myCoins -= price;
                    up.level++;
                    updateUI();
                    saveLocal();
                    showFloating(`⭐ ${up.name} улучшен!`, "#aaffaa");
                } else {
                    showFloating("💰 Не хватает монет!", "#ff8888");
                }
            });
        });
    }

    function updateUI() {
        document.getElementById("coinsDisplay").innerHTML = Math.floor(myCoins);
        document.getElementById("powerInfo").innerHTML = `⚡ Сила клика: ${calcPower()}`;
        renderUpgrades();
    }

    function saveLocal() {
        localStorage.setItem("nick", currentNick);
        localStorage.setItem("coins", myCoins);
        localStorage.setItem("upgrades", JSON.stringify(upgrades.map(u => u.level)));
    }

    function loadLocal() {
        let savedUpgrades = localStorage.getItem("upgrades");
        if (savedUpgrades) {
            let levels = JSON.parse(savedUpgrades);
            levels.forEach((lvl, i) => { if (upgrades[i]) upgrades[i].level = lvl; });
        }
    }

    function showFloating(text, color) {
        let div = document.createElement("div");
        div.className = "floating";
        div.innerText = text;
        div.style.background = color;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 2000);
    }

    // ========== РАБОТА С GITHUB (ОБЩАЯ ТАБЛИЦА) ==========
    async function loadLeaders() {
        try {
            let url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/leaders.json`;
            let res = await fetch(url);
            if (!res.ok) throw new Error();
            let data = await res.json();
            return data.leaders || [];
        } catch(e) {
            console.log("Ошибка загрузки:", e);
            return [];
        }
    }

    async function saveLeaders(leaders) {
        try {
            let getRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/leaders.json`, {
                headers: { "Authorization": `token ${GITHUB_TOKEN}` }
            });
            let fileData = await getRes.json();

            let content = btoa(unescape(encodeURIComponent(JSON.stringify({ leaders: leaders }, null, 2))));
            await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/leaders.json`, {
                method: "PUT",
                headers: { "Authorization": `token ${GITHUB_TOKEN}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: "Update leaders from clicker",
                    content: content,
                    sha: fileData.sha
                })
            });
            return true;
        } catch(e) {
            console.error("Ошибка сохранения:", e);
            return false;
        }
    }

    async function syncToLeaderboard() {
        if (!currentNick || currentNick === "") {
            showFloating("⚠️ Сначала введи ник!", "#ffaa66");
            return;
        }
        showFloating("📡 Сохранение...", "#3a6b6b");
        let leaders = await loadLeaders();
        let existing = leaders.find(l => l.name === currentNick);
        if (existing) existing.score = myCoins;
        else leaders.push({ name: currentNick, score: myCoins });
        leaders.sort((a,b) => b.score - a.score);
        leaders = leaders.slice(0, 50);

        let success = await saveLeaders(leaders);
        if (success) {
            showFloating("✅ Твой прогресс сохранён в общую таблицу!", "#2a6b4e");
            await showLeaders();
        } else {
            showFloating("❌ Ошибка сохранения! Проверь токен.", "#ff8888");
        }
    }

    async function showLeaders() {
        let container = document.getElementById("leadersList");
        let leaders = await loadLeaders();
        if (!leaders || leaders.length === 0) {
            container.innerHTML = "<div class='loading'>😢 Пока нет игроков. Будь первым!</div>";
            return;
        }
        leaders.sort((a,b) => b.score - a.score);
        container.innerHTML = "";
        leaders.slice(0, 15).forEach((l, i) => {
            let row = document.createElement("div");
            row.className = "leader-row";
            let medal = i === 0 ? "🏆" : (i === 1 ? "🥈" : (i === 2 ? "🥉" : `${i+1}.`));
            row.innerHTML = `
                <div class="leader-rank">${medal}</div>
                <div class="leader-name">${escapeHtml(l.name)}</div>
                <div class="leader-score">${Math.floor(l.score)} 💎</div>
            `;
            container.appendChild(row);
        });
    }

    function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; return m==='<' ? '&lt;' : '&gt;'; }); }

    // ========== КЛИКЕР ==========
    function onTap() {
        let gain = clickPower;
        if (Math.random() < 0.1) gain *= 2;
        myCoins += gain;
        updateUI();
        saveLocal();
        
        // Визуальный фидбек
        let btn = document.getElementById("clickBtn");
        btn.style.transform = "scale(0.96)";
        setTimeout(() => btn.style.transform = "", 100);
        
        if (navigator.vibrate) navigator.vibrate(10);
    }

    // ========== ИНИЦИАЛИЗАЦИЯ ==========
    document.getElementById("nickname").value = currentNick;
    loadLocal();
    calcPower();
    updateUI();
    showLeaders();

    document.getElementById("setNickBtn").onclick = () => {
        let nick = document.getElementById("nickname").value.trim();
        if (nick === "") {
            showFloating("⚠️ Введи ник!", "#ffaa66");
            return;
        }
        if (nick.length > 20) {
            showFloating("❌ Ник не длиннее 20 символов", "#ff8888");
            return;
        }
        currentNick = nick;
        saveLocal();
        showFloating(`👋 Привет, ${nick}!`, "#aaffaa");
    };

    document.getElementById("clickBtn").onclick = onTap;
    document.getElementById("syncBtn").onclick = syncToLeaderboard;
    document.getElementById("copyLinkBtn").onclick = () => {
        navigator.clipboard.writeText(window.location.href);
        showFloating("🔗 Ссылка скопирована! Отправь друзьям!", "#aaffaa");
    };

    // Автосохранение в таблицу раз в минуту (если ник введён)
    setInterval(() => {
        if (currentNick && currentNick !== "") {
            syncToLeaderboard();
        }
    }, 60000);
</script>
</body>
  </html>
